name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        # 注意：不要加 `| true` 吞退出码 —— 那会让门失效（曾因此 typecheck 无论成败都绿）
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (Vite)
        run: npm run build
