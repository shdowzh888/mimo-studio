name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── macOS (x64 + arm64) ──────────────────────────────────
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx vite build
      # 不内置 MiMo CLI — 用户首次启动时自动下载（优先自有码云 release 资产）
      - name: Build macOS (${{ matrix.arch }})
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/MiMo-Studio-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-tarxz
          path: release/MiMo-Studio-*-mac-*.tar.xz

  # ── Linux (AppImage + deb) ───────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          sudo apt-get update && sudo apt-get install -y ruby
          sudo gem install fpm
      - run: npm install
      - run: npx vite build
      # 不内置 MiMo CLI — 用户首次启动时自动下载（优先自有码云 release 资产）
      - name: Build Linux
        run: npx electron-builder --linux AppImage deb tar.xz --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/MiMo-Studio-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/MiMo-Studio-*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar-xz
          path: release/MiMo-Studio-*-linux-*.tar.xz

  # ── Windows (NSIS) ───────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx vite build
      # 不内置 MiMo CLI — 用户首次启动时自动下载（优先自有码云 release 资产）
      - name: Build Windows
        run: npx electron-builder --win --publish never
      # 只上传 Windows 的更新元数据（latest.yml + blockmap）：
      # Linux 构建同样生成 latest.yml，若也上传会与 Windows 的同名资产在
      # GitHub Release 上互相覆盖（各指各的平台文件），Windows 更新会读到 Linux 的清单而失效。
      # macOS 未签名无法自动更新，latest-mac.yml 暂不上传。
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            release/MiMo-Studio-Setup-*.exe
            release/*.exe.blockmap
            release/latest.yml

  # ── MiMo CLI 归档转存（自有码云 release 的国内下载源）──────
  # 官方镜像 gitee.com/mirrors/mimocode 不同步 release 附件（实测全版本 404），
  # 故 CI 从上游拉归档转存到本项目同名 release，安装器按应用 tag 寻址。
  # 上游出新版时同步 bump MIMO_CLI_VERSION（版本号必须真实存在，否则 curl 404 → 整个发版 job 挂）。
  # 四件套约 157MB/版（win-x64 46 + darwin-arm64 32 + darwin-x64 35 + linux-x64 44），
  # 码云总配额 1GB → 发新版前务必删掉旧 release 的 mimocode-* 资产（见 AGENTS.md 的删旧 release 约定）。
  # 平台覆盖 = 应用实际发布的平台：macOS 同时发 x64 与 arm64，Windows/Linux 只发 x64。
  cli-assets:
    runs-on: ubuntu-latest
    env:
      MIMO_CLI_VERSION: v0.1.17
    steps:
      - name: Download upstream CLI archives
        run: |
          set -e
          mkdir -p cli-assets && cd cli-assets
          BASE="https://github.com/XiaomiMiMo/MiMo-Code/releases/download/${MIMO_CLI_VERSION}"
          curl -fSL --retry 3 --retry-delay 5 -o mimocode-windows-x64.zip  "$BASE/mimocode-windows-x64.zip"
          curl -fSL --retry 3 --retry-delay 5 -o mimocode-darwin-arm64.zip "$BASE/mimocode-darwin-arm64.zip"
          curl -fSL --retry 3 --retry-delay 5 -o mimocode-darwin-x64.zip   "$BASE/mimocode-darwin-x64.zip"
          curl -fSL --retry 3 --retry-delay 5 -o mimocode-linux-x64.tar.gz "$BASE/mimocode-linux-x64.tar.gz"
          # 上游为 MIT 许可：再分发二进制必须附带许可声明（tag 里没有就回退 main）
          curl -fSL --retry 3 --retry-delay 5 -o mimocode-LICENSE.txt \
            "https://raw.githubusercontent.com/XiaomiMiMo/MiMo-Code/${MIMO_CLI_VERSION}/LICENSE" \
            || curl -fSL --retry 3 --retry-delay 5 -o mimocode-LICENSE.txt \
            "https://raw.githubusercontent.com/XiaomiMiMo/MiMo-Code/main/LICENSE"
      - name: Generate SHA256SUMS
        run: |
          cd cli-assets
          sha256sum mimocode-windows-x64.zip mimocode-darwin-arm64.zip mimocode-darwin-x64.zip mimocode-linux-x64.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mimo-cli-assets
          path: cli-assets/*

  # ── GitHub Release ─────────────────────────────────────
  github-release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.dmg
            **/*.exe
            **/*.AppImage
            **/*.deb
            **/*.tar.xz
            **/latest*.yml
          generate_release_notes: true

  # ── Gitee Release (aggregator) ───────────────────────────
  gitee-release:
    needs: [macos, linux, windows, cli-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4

      # 码云附件总配额只有 1GB：应用制品约 400MB + CLI 归档 157MB ≈ 560MB/版本，
      # 装不下两个版本 —— 不清理的话新版本上传会直接失败。
      # 码云 API v5 没有"删除单个附件"的端点（实测 DELETE /attach_files/{name} → 404），
      # 只能整体删除 release（DELETE /releases/{id} 带 token 可用）。所以策略是：
      #   发版前清空本仓库的 release 记录 → 下面步骤重建当前版本并上传全部资产。
      # 副作用（可接受）：
      #   1. 码云上只保留最新版的 release 页面；历史版本安装包在 GitHub Release 仍有；
      #   2. 旧 tag 的 release 源码包链接失效（tag 与源码本身不受影响）；
      #   3. 当前版本重建为全新 release，重跑 workflow 不会撞同名附件。
      # 删除失败只告警不阻断（真正超配额会在上传步骤明确报错）。
      - name: Clean up old Gitee releases (quota)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          API_BASE="https://gitee.com/api/v5/repos/shdowzh/mimo-studio"
          TOKEN="$GITEE_TOKEN"
          [ -n "$TOKEN" ] || { echo "ERROR: 仓库未配置 GITEE_TOKEN secret"; exit 1; }

          # 先校验 token：无效时码云一律返回 {"message":"401 Unauthorized"}，
          # 后面 jq 解析错误体会很难懂，直接在这里报错退出。
          WHO=$(curl -sS "$API_BASE/releases?access_token=$TOKEN&per_page=1" \
            | jq -r 'if type == "array" then "ok" else (.message // "unknown") end' 2>/dev/null || echo "unknown")
          if [ "$WHO" != "ok" ]; then
            echo "ERROR: GITEE_TOKEN 不可用（码云返回: $WHO）"
            exit 1
          fi

          echo "==> 清理旧 release（码云配额 1GB，发版前腾空间）"
          curl -sS "$API_BASE/releases?access_token=$TOKEN&per_page=100" \
            | jq -r '.[]? | "\(.id) \(.tag_name)"' 2>/dev/null \
            | while read -r ID NAME; do
                [ -z "$ID" ] && continue
                CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                  "$API_BASE/releases/$ID?access_token=$TOKEN" 2>/dev/null || true)
                case "$CODE" in
                  200|204|404) echo "    已删除 release $NAME (id=$ID)" ;;
                  *) echo "    WARN 删除失败 ($CODE): $NAME (id=$ID)" ;;
                esac
              done
          echo "==> 清理完成，下面会重建当前版本的 release"

      # 码云主仓库可能没同步本次代码（国内镜像滞后），而码云建 release 要求标签已存在；
      # 标签缺失时建 release 会直接失败 → 先确保标签存在（已存在则跳过）。
      - name: Ensure Gitee tag exists
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          API_BASE="https://gitee.com/api/v5/repos/shdowzh/mimo-studio"
          TOKEN="$GITEE_TOKEN"
          TAG="${{ github.ref_name }}"
          [ -n "$TOKEN" ] || { echo "ERROR: 仓库未配置 GITEE_TOKEN secret"; exit 1; }

          COUNT=$(curl -sS "$API_BASE/tags?access_token=$TOKEN&per_page=100" \
            | jq -r --arg t "$TAG" '[.[]? | select(.name==$t)] | length' 2>/dev/null || echo 0)
          if [ "${COUNT:-0}" != "0" ]; then
            echo "==> 码云标签 $TAG 已存在"
            exit 0
          fi

          echo "==> 创建码云标签 $TAG（指向码云 main）"
          SHA=$(curl -sS "$API_BASE/branches/main?access_token=$TOKEN" \
            | jq -r '.commit.sha // empty' 2>/dev/null || true)
          if [ -z "$SHA" ]; then
            echo "ERROR: 取不到码云 main 分支 SHA，无法创建标签"
            exit 1
          fi
          RESP=$(curl -sS -X POST "$API_BASE/tags?access_token=$TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"message\":\"Release $TAG\",\"ref\":\"main\",\"sha\":\"$SHA\"}" || true)
          if echo "$RESP" | jq -e '.tag_name' >/dev/null 2>&1; then
            echo "==> 标签已创建: $TAG -> $SHA"
          else
            echo "ERROR: 创建码云标签失败: $RESP"
            exit 1
          fi

      # 上传资产：单文件失败不中断本轮，最后统一回读核对。
      # v1.5.0 就是在这里把 90MB 的 .deb 静默漏掉了（curl 失败但管道里 jq 退出码为 0），
      # 所以这里显式判 HTTP 码 + 响应体，并在末尾拉取资产列表核对缺失项。
      - name: Upload to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          API_BASE="https://gitee.com/api/v5/repos/shdowzh/mimo-studio"
          TOKEN="$GITEE_TOKEN"
          TAG="${{ github.ref_name }}"
          TAG_NUM="${TAG#v}"
          LIMIT=104857600

          [ -n "$TOKEN" ] || { echo "ERROR: 仓库未配置 GITEE_TOKEN secret"; exit 1; }

          # 1. 找或建 release（解析失败时打印原文再退出，别让 jq 报错误导步骤失败）
          RELEASES=$(curl -sS "$API_BASE/releases?access_token=$TOKEN&per_page=50" || true)
          RELEASE_ID=$(printf '%s' "$RELEASES" \
            | jq -r --arg t "$TAG" '[.[]? | select(.tag_name==$t)][0].id // empty' 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "==> 创建码云 release: $TAG"
            RESP=$(curl -sS -X POST "$API_BASE/releases?access_token=$TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"MiMo Studio $TAG_NUM\",\"body\":\"Release $TAG_NUM\",\"prerelease\":false,\"target_commitish\":\"main\"}" || true)
            RELEASE_ID=$(printf '%s' "$RESP" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -z "$RELEASE_ID" ]; then
              echo "ERROR: 创建码云 release 失败: $RESP"
              exit 1
            fi
          fi
          echo "==> Release ID: $RELEASE_ID"

          # 2. 逐个上传（>100MB 跳过：码云单文件硬限制）
          UPLOADED=""
          SKIPPED=""
          FAILED=""
          while IFS= read -r f; do
            NAME="$(basename "$f")"
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "SKIP (>100MB): $NAME ($(( SIZE / 1048576 ))MB)"
              SKIPPED="$SKIPPED $NAME"
              continue
            fi
            CODE=$(curl -sS -o /tmp/gitee_asset.json -w '%{http_code}' --max-time 900 \
              --retry 3 --retry-delay 5 --retry-all-errors \
              -X POST "$API_BASE/releases/$RELEASE_ID/attach_files?access_token=$TOKEN" \
              -F "file=@$f" 2>/dev/null || true)
            MSG=$(jq -r '.browser_download_url // .message // empty' /tmp/gitee_asset.json 2>/dev/null || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "OK: $NAME ($(( SIZE / 1048576 ))MB) -> $MSG"
              UPLOADED="$UPLOADED $NAME"
            elif echo "$MSG" | grep -qE "已存在|already exists"; then
              # 附件重名：码云不会覆盖同名附件（并发上传或重跑 workflow 时会撞上），
              # 这里当成功处理，最终仍由资产列表核对兜底。
              echo "DUP: $NAME 已存在（跳过上传）"
              UPLOADED="$UPLOADED $NAME"
            else
              echo "FAIL: $NAME ($(( SIZE / 1048576 ))MB) http=$CODE $MSG"
              FAILED="$FAILED $NAME"
            fi
          done < <(find . -path ./.git -prune -o -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.xz" -o -name "mimocode-*" -o -name "SHA256SUMS" \) -print | sort)

          # 3. 回读资产列表核对
          echo "==> 码云 release 当前资产："
          curl -sS "$API_BASE/releases/$RELEASE_ID?access_token=$TOKEN" \
            | jq -r '.assets[]?.name' 2>/dev/null | sed 's/^/    /' || true

          if [ -n "$FAILED" ]; then
            echo "ERROR: 以下文件上传失败（码云 release 不完整）:$FAILED"
            exit 1
          fi
          echo "==> Done. 已上传:$UPLOADED"
          [ -n "$SKIPPED" ] && echo "==> 跳过(>100MB 码云限制):$SKIPPED"
